name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.9
      - name: Ruff (rules in ruff.toml)
        run: ruff check .
      - name: UI scripts parse
        run: |
          node -e "new Function(require('fs').readFileSync('field/app/static/app.js','utf8'))"
          node -e "new Function(require('fs').readFileSync('impact/app/static/app.js','utf8'))"

  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    env:
      QDRANT_TEST_URL: http://127.0.0.1:6333
      QDRANT_CLUSTER_TEST_URL: http://127.0.0.1:6433
      SAAKSHI_DISABLE_CLIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-bench.txt
      - name: Start a cluster-mode Qdrant (regional shard keys)
        run: |
          docker run -d --name qdrant-cluster -p 6433:6333 -e QDRANT__CLUSTER__ENABLED=true \
            qdrant/qdrant:v1.19.1 ./qdrant --uri http://127.0.0.1:6335
      - name: Wait for both Qdrant servers
        run: |
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:6333/ >/dev/null && curl -sf http://127.0.0.1:6433/cluster | grep -q enabled && break; sleep 1; done
      - run: pytest -v
      - name: Benchmarks smoke run
        run: |
          python -m bench.bench_search --sizes 1000 --queries 20
          python -m bench.bench_sync --global-url http://127.0.0.1:6333 --cluster-url http://127.0.0.1:6433 --per-project 200 --new 10
          python -m bench.bench_fieldday --days 3
          python -m bench.report
